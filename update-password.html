<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Article App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">

        <header class="site-header">
            <div class="window-bar">
                <div class="window-name">
                    <span class="window-icon">◎</span>
                    <span>ARTICLE APP</span>
                </div>

                <div class="window-controls">
                    <span>_</span>
                    <span>□</span>
                    <span>×</span>
                </div>
            </div>

            <nav>
                <div class="login-nav">
                    <a href="index.html">Articles</a>
                    <a href="login.html">Log in</a>
                    <a href="register.html">Register</a>
                </div>
            </nav>
        </header>

        <main class="auth-window">
            <div class="auth-content">

                <div class="section-heading">
                    <span class="status-square"></span>
                    <h1>Update password</h1>
                </div>

                <form id="update-password-form" class="auth-form">

                    <div class="form-field">
                        <label for="password">New password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="confirm-password">
                            Confirm password
                        </label>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-button">
                        Update password
                    </button>

                </form>

                <p id="message" class="auth-message"></p>

                <div class="auth-footer">
                    <span>Remember your password?</span>
                    <a href="login.html">Log in</a>
                </div>

            </div>
        </main>

        <footer>
            <span>ARTICLE APP // PASSWORD UPDATE</span>
            <span>● SYSTEM ONLINE</span>
        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>

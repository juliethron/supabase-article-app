<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Article - Article App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">

        <header class="site-header">

            <div class="window-bar">
                <div class="window-name">
                    <span class="window-icon">◎</span>
                    <span>ARTICLE APP</span>
                </div>

                <div class="window-controls">
                    <span>_</span>
                    <span>□</span>
                    <span>×</span>
                </div>
            </div>

            <nav>
                <div id="logged-out-nav" hidden>
                    <a href="index.html">Articles</a>
                    <a href="login.html">Log in</a>
                    <a href="register.html">Register</a>
                </div>

                <div id="logged-in-nav">
                    <a href="index.html">Articles</a>
                    <a href="create.html">Create article</a>
                    <button id="logout-button">Log out</button>
                </div>
            </nav>

        </header>


        <main class="auth-window">

            <div class="auth-content">

                <div class="section-heading">
                    <span class="status-square"></span>
                    <h1>Create an article</h1>
                </div>


                <form id="article-form" class="auth-form">

                    <div class="form-field">
                        <label for="title">Title</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            required
                        >
                    </div>


                    <div class="form-field">
                        <label for="category">Category</label>
                        <input
                            type="text"
                            id="category"
                            name="category"
                            required
                        >
                    </div>


                    <div class="form-field">
                        <label for="body">Article</label>
                        <textarea
                            id="body"
                            name="body"
                            rows="10"
                            required
                        ></textarea>
                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Publish article
                    </button>

                </form>


                <p
                    id="message"
                    class="auth-message"
                ></p>

            </div>

        </main>


        <footer>
            <span>ARTICLE APP // CREATE ARTICLE</span>
            <span>● SYSTEM ONLINE</span>
        </footer>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/articles.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Article App</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page">

        <header class="site-header">
            <div class="window-bar">
                <div class="window-name">
                    <span class="window-icon">◎</span>
                    <span>ARTICLE APP</span>
                </div>

                <div class="window-controls">
                    <span>_</span>
                    <span>□</span>
                    <span>×</span>
                </div>
            </div>

            <nav>
                <div class="login-nav">
                    <a href="index.html">Articles</a>
                    <a href="login.html">Log in</a>
                    <a href="register.html">Register</a>
                </div>
            </nav>
        </header>


        <main class="auth-window">

            <div class="auth-content">

                <div class="section-heading">
                    <span class="status-square"></span>
                    <h1>Log in</h1>
                </div>

                <form id="login-form" class="auth-form">

                    <div class="form-field">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-button">
                        Log in
                    </button>

                    <p class="forgot-password">
    <a href="reset.html">Forgot your password?</a>
</p>

                </form>

                <p id="message" class="auth-message"></p>

                <div class="auth-footer">
                    <span>Don't have an account?</span>
                    <a href="register.html">Create one</a>
                </div>

            </div>

        </main>


        <footer>
            <span>ARTICLE APP // LOGIN</span>
            <span>● SYSTEM ONLINE</span>
        </footer>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
